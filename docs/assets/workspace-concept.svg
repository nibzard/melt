    <rect x="49" y="573" width="1022" height="103" rx="10" fill="#f3f6f2"/>
    <text x="69" y="601" font-size="12" font-weight="700" letter-spacing="1" fill="#54725e">AGENT PANEL · PROPOSED HOST FEATURE</text>
    <text x="69" y="630" font-size="18" fill="#243c30">“Add a risk inspector for the selected supplier.”</text>
    <circle cx="75" cy="653" r="5" fill="#237650"/>
    <text x="90" y="658" font-size="14" fill="#4b6655">View added. Selection preserved. No analysis rerun.</text>

    <text x="40" y="736" font-size="15" font-weight="700" fill="#233e31">SELECT</text>
    <text x="40" y="763" font-size="14" fill="#54675d">One saved reference updates the views.</text>
    <text x="421" y="736" font-size="15" font-weight="700" fill="#233e31">EXTEND</text>
    <text x="421" y="763" font-size="14" fill="#54675d">Add a view. Keep the current state.</text>
    <text x="787" y="736" font-size="15" font-weight="700" fill="#233e31">REOPEN</text>
    <text x="787" y="763" font-size="14" fill="#54675d">Restore without running Python.</text>
