    <text x="40" y="43" font-size="13" font-weight="700" letter-spacing="2" fill="#47665a">MELT / INTERFACE CONCEPT</text>
    <text x="40" y="91" font-size="34" font-weight="700" fill="#182e26">One selection. Every view stays in step.</text>
    <text x="40" y="123" font-size="17" fill="#54675d">A supplier workspace, extended without losing its state.</text>

