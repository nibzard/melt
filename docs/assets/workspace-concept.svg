<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="800" viewBox="0 0 1120 800" role="img" aria-labelledby="title description">
  <title id="title">Melt: one selection, several views</title>
  <desc id="description">A concept for a future desktop host, based on the linked views example. Beta Systems, supplier S-73, is selected in a graph. The supplier inspector shows France, and an added risk inspector shows High. A proposed agent panel requests the new inspector while preserving the selection. This is an illustration, not a shipped interface.</desc>
